<!DOCTYPE html>
<html lang="kr">
<head>
  <meta charset="UTF-8">
  <title>NCNK</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel ="stylesheet" href="/css/mypage.css">
  <link rel="icon" href="/images/favicon.svg">
</head>
<body>
<div th:replace="~{navbar::nav}"></div>
<div class="container">
  <div id="my-profile">
    <div class="profile-box">
      <div class="profile-top"></div>-->
      <div class="profile-top">
        <a class="setting" th:href="@{/member/edit/{id}(id=${memberId})}"><i class="fa-solid fa-gear" style="color: #ffffff;"></i></a>
        <div class ="profile-image"><img th:if="${profile != null }" th:src="${profile}" >
        </div>
        <div class ="my-name">
          <p class="nickname" ><span th:text="${nickName}"></span></p>
          <div class="profile-username">
            <p class ="username" >USERNAME</p>
            <span class="user-name" th:text="${name}"></span>
          </div>
        </div>
        <div class ="git-email">
          <ul>
            <p class="github"><i class="fa-brands fa-github" style="color: #000000"></i><span th:text="${github}"></span></p>
            <p class="email"><i class="fa-regular fa-envelope" style="color: #000000;"></i><span th:text="${email}"></span></p>
          </ul>
        </div>
      </div>
    </div>

    <div class ="my-point-total">
      <div class="point-box">
        <div class="user-point">
          <p class="point">My Point  <span th:text="${point}"></span></p>
        </div>
        <hr class="divider">
        <div class ="difficulty">
          <p class="hard">상<br><span th:text="${hard}"></span></p>

          <p class="normal">중<br><span th:text="${normal}"></span></p>

          <p class="easy">하<br><span th:text="${easy}"></span></p>

          <span></span>
        </div>
      </div>
    </div>
  </div>
  <div class ="my-test">
    <p>오른쪽 요소들</p>
  </div>
</div>
</body>
</html>
